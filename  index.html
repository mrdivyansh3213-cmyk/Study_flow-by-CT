    const DEFAULT_DAILY = ["Wake up at 7:00","No mobile for first 30 min","Complete 5-6 lectures daily","Manifest for 10 min","Make short notes during class","Revision of all topics","Practice Accountancy","Practice Maths","Recall Law and Eco","Update error notebook","Sleep before 11","No backlogs","Content creation 45 min","Drink water and short walk","Track study hours","Make tomorrow plan","Push-ups","Pull-ups","Avoid Junk Food","Sleep 7 hrs"];
    const DEFAULT_WEEKLY = ["Fix study routine completely","Study consistently every day","Complete planned lectures without delay","Build revision habit","Avoid burnout","Hair oil massage","Trim nails (hands & feet)","Wash bedsheets & pillow covers","Clean shoes","Review study performance"];
    const DEFAULT_MONTHLY = ["Build disciplined study routine","Catch up with batch syllabus","Complete major backlog","Create proper notes for all chapters","Build daily revision habit","Keep consistency above motivation","Limit distractions and unnecessary habits","Maintain error notebook regularly","Review goals","Plan next month"];
    const MOODS = [{e:"🔥",l:"On fire",v:5},{e:"😊",l:"Good",v:4},{e:"😐",l:"Okay",v:3},{e:"😴",l:"Tired",v:2},{e:"😩",l:"Burnt",v:1}];
    const QUOTES = ["Small daily improvements lead to stunning results.","You don't have to be great to start, but you have to start to be great.","The expert in anything was once a beginner.","Your future self is watching right now through memories.","Done is better than perfect.","Discipline is choosing between what you want now and what you want most.","CA Foundation is hard. But so are you.","Consistency beats intensity every single time.","Success is the sum of small efforts repeated day in and day out.","Each day is a new beginning. Take a deep breath and start again."];

    const getToday = () => new Date().toISOString().split("T")[0];
    const getThisMonth = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`; };
    const getThisWeek = () => { const d=new Date(),day=d.getDay(),diff=d.getDate()-day+(day===0?-6:1); const m=new Date(d.setDate(diff)); return m.toISOString().split("T")[0]; };
    const getMonthDates = () => { const d=new Date(),y=d.getFullYear(),mo=d.getMonth(),days=new Date(y,mo+1,0).getDate(); return Array.from({length:days},(_,i)=>{const dt=new Date(y,mo,i+1);return{date:i+1,key:dt.toISOString().split("T")[0],day:["Su","Mo","Tu","We","Th","Fr","Sa"][dt.getDay()]};}); };
    const fmt = s => { const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60; return h>0?`${h}:${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`:`${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`; };
    const loadSafe = (key, fallback) => { try { const d=localStorage.getItem(key); return d?JSON.parse(d):fallback; } catch { return fallback; } };
    const saveSafe = (key, val) => { try { localStorage.setItem(key, JSON.stringify(val)); } catch {} };

    function Icon({name,size=18}){
      const s=size;
      const icons={
        home:<svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>,
        check:<svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>,
        timer:<svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>,
        book:<svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>,
        habit:<svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>,
        plus:<svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>,
        trash:<svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>,
        x:<svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>,
        play:<svg width={s} height={s} viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>,
        pause:<svg width={s} height={s} viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>,
        stop:<svg width={s} height={s} viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>,
        chevron:<svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 18 15 12 9 6"/></svg>,
        edit:<svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>,
      };
      return icons[name]||null;
    }

    function Ring({pct,size=80,stroke=6,color="#7C3AED",children}){
      const r=(size-stroke)/2,circ=2*Math.PI*r,offset=circ-(Math.min(pct,100)/100)*circ;
      return(
        <div style={{position:"relative",width:size,height:size,flexShrink:0}}>
          <svg width={size} height={size} style={{transform:"rotate(-90deg)"}}>
            <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="#1e1e2e" strokeWidth={stroke}/>
            <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth={stroke} strokeDasharray={circ} strokeDashoffset={offset} strokeLinecap="round" style={{transition:"stroke-dashoffset 0.6s ease"}}/>
          </svg>
          <div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column"}}>{children}</div>
        </div>
      );
    }

    function EditPanel({daily,weekly,monthly,onSave,onClose}){
      const [eTab,setETab]=useState("daily");
      const [eDaily,setEDaily]=useState([...daily]);
      const [eWeekly,setEWeekly]=useState([...weekly]);
      const [eMonthly,setEMonthly]=useState([...monthly]);
      const [input,setInput]=useState("");
      const [saved,setSaved]=useState(false);
      const current=eTab==="daily"?eDaily:eTab==="weekly"?eWeekly:eMonthly;
      const setCurrent=eTab==="daily"?setEDaily:eTab==="weekly"?setEWeekly:setEMonthly;
      function addItem(){if(!input.trim())return;setCurrent(p=>[...p,input.trim()]);setInput("");}
      function removeItem(i){setCurrent(p=>p.filter((_,idx)=>idx!==i));}
      function handleSave(){onSave(eDaily,eWeekly,eMonthly);setSaved(true);setTimeout(()=>{setSaved(false);onClose();},1000);}
      return(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.88)",zIndex:200,display:"flex",alignItems:"flex-end"}}>
          <div style={{background:"#0d1117",borderRadius:"24px 24px 0 0",width:"100%",maxHeight:"88vh",overflowY:"auto",padding:"0 16px 40px",border:"1px solid #1f2937"}}>
            <div style={{position:"sticky",top:0,background:"#0d1117",paddingTop:16,paddingBottom:12,zIndex:2,borderBottom:"1px solid #111827",marginBottom:14}}>
              <div style={{width:40,height:4,background:"#374151",borderRadius:2,margin:"0 auto 14px"}}/>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <span style={{fontSize:16,fontWeight:700,color:"#f9fafb"}}>✏️ Edit Habits</span>
                <div style={{display:"flex",gap:8}}>
                  <button onClick={handleSave} style={{background:saved?"#10B981":"#7C3AED",border:"none",borderRadius:10,padding:"9px 18px",color:"white",fontWeight:700,cursor:"pointer",fontSize:13,transition:"background 0.3s"}}>{saved?"Saved ✓":"Save"}</button>
                  <button onClick={onClose} style={{background:"#1f2937",border:"none",borderRadius:10,padding:"9px 13px",color:"#9ca3af",cursor:"pointer",fontSize:13}}>✕</button>
                </div>
              </div>
            </div>
            <div style={{display:"flex",background:"#111827",borderRadius:12,padding:4,marginBottom:16,border:"1px solid #1f2937"}}>
              {[["daily","Daily 📅"],["weekly","Weekly 📆"],["monthly","Monthly 🗓"]].map(([id,lb])=>(
                <button key={id} onClick={()=>{setETab(id);setInput("");}} style={{flex:1,padding:"9px 4px",borderRadius:8,border:"none",cursor:"pointer",fontSize:11,fontWeight:600,background:eTab===id?"#7C3AED":"transparent",color:eTab===id?"white":"#6b7280",transition:"all 0.2s"}}>{lb}</button>
              ))}
            </div>
            <div style={{display:"flex",gap:8,marginBottom:14}}>
              <input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addItem()} placeholder={`Add new ${eTab} habit...`} style={{flex:1,background:"#111827",border:"1px solid #374151",borderRadius:10,padding:"11px 13px",color:"#f9fafb",fontSize:13,outline:"none"}}/>
              <button onClick={addItem} style={{background:"#7C3AED",border:"none",borderRadius:10,padding:"11px 16px",color:"white",fontWeight:700,cursor:"pointer",fontSize:18,lineHeight:1}}>+</button>
            </div>
            <div style={{fontSize:11,color:"#4b5563",marginBottom:10}}>{current.length} habits</div>
            <div style={{display:"flex",flexDirection:"column",gap:7}}>
              {current.length===0&&<div style={{textAlign:"center",padding:"24px 0",color:"#4b5563",fontSize:13}}>No habits yet — add one above! 😊</div>}
              {current.map((h,i)=>(
                <div key={i} style={{display:"flex",alignItems:"center",gap:10,background:"#111827",borderRadius:12,padding:"12px 14px",border:"1px solid #1f2937"}}>
                  <span style={{fontSize:11,color:"#4b5563",minWidth:20,fontWeight:600}}>#{i+1}</span>
                  <span style={{flex:1,fontSize:13,color:"#d1d5db"}}>{h}</span>
                  <button onClick={()=>removeItem(i)} style={{background:"#EF444422",border:"1px solid #EF444466",borderRadius:8,padding:"5px 10px",color:"#EF4444",cursor:"pointer",fontSize:11,fontWeight:700}}>✕</button>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    function App(){
      const [tab,setTab]=useState("home");
      const TODAY=getToday(),TM=getThisMonth(),TW=getThisWeek();
      const [quote]=useState(QUOTES[Math.floor(Math.random()*QUOTES.length)]);
      const POM={FOCUS:{dur:FOCUS_DURATION,color:"#7C3AED",label:"Focus 🔥"},SHORT_BREAK:{dur:SHORT_BREAK,color:"#10B981",label:"Break ☕"},LONG_BREAK:{dur:LONG_BREAK,color:"#3B82F6",label:"Long Break 🌙"}};

      const [dailyHabits,setDailyHabits]=useState(()=>loadSafe("sf_daily",DEFAULT_DAILY));
      const [weeklyHabits,setWeeklyHabits]=useState(()=>loadSafe("sf_weekly",DEFAULT_WEEKLY));
      const [monthlyHabits,setMonthlyHabits]=useState(()=>loadSafe("sf_monthly",DEFAULT_MONTHLY));
      const [showEdit,setShowEdit]=useState(false);
      const [habitTab,setHabitTab]=useState("daily");
      const [tasks,setTasks]=useState(()=>loadSafe("sf_tasks_"+TODAY,[]));
      const [newTask,setNewTask]=useState("");
      const [newPri,setNewPri]=useState("medium");
      const [showAdd,setShowAdd]=useState(false);
      const [celebrate,setCelebrate]=useState(false);
      const [habitChecks,setHabitChecks]=useState(()=>loadSafe("sf_habits",{}));
      const [completedTopics,setCompletedTopics]=useState(()=>loadSafe("sf_topics",{}));
      const [expandedPaper,setExpandedPaper]=useState(null);
      const [expandedChapter,setExpandedChapter]=useState(null);
      const [mood,setMoodState]=useState(()=>loadSafe("sf_mood_"+TODAY,null));
      const [studySessions,setStudySessions]=useState(()=>loadSafe("sf_sessions",{}));
      const [streak,setStreak]=useState(()=>loadSafe("sf_streak",0));
      const [lastActive,setLastActive]=useState(()=>loadSafe("sf_lastactive",null));
      const [timerActive,setTimerActive]=useState(false);
      const [timerPaused,setTimerPaused]=useState(false);
      const [timerSecs,setTimerSecs]=useState(0);
      const [timerSubject,setTimerSubject]=useState(Object.keys(CA_PAPERS)[0]);
      const timerRef=useRef(null);
      const timerStartRef=useRef(null);
      const timerAccRef=useRef(0);
      const [pomMode,setPomMode]=useState("FOCUS");
      const [pomActive,setPomActive]=useState(false);
      const [pomPaused,setPomPaused]=useState(false);
      const [pomSecs,setPomSecs]=useState(FOCUS_DURATION);
      const [pomRounds,setPomRounds]=useState(0);
      const pomRef=useRef(null);
      const pomStartRef=useRef(null);
      const pomAccRef=useRef(0);

      useEffect(()=>{saveSafe("sf_tasks_"+TODAY,tasks);},[tasks]);
      useEffect(()=>{saveSafe("sf_habits",habitChecks);},[habitChecks]);
      useEffect(()=>{saveSafe("sf_topics",completedTopics);},[completedTopics]);
      useEffect(()=>{saveSafe("sf_sessions",studySessions);},[studySessions]);

      function handleSaveHabits(d,w,m){setDailyHabits(d);saveSafe("sf_daily",d);setWeeklyHabits(w);saveSafe("sf_weekly",w);setMonthlyHabits(m);saveSafe("sf_monthly",m);}
      const setMood=v=>{setMoodState(v);saveSafe("sf_mood_"+TODAY,v);};
      const hKey=(type,name,dk)=>`${type}::${name}::${dk}`;
      const isDone=(type,name,dk)=>!!habitChecks[hKey(type,name,dk)];
      const toggleHabit=(type,name,dk)=>{const k=hKey(type,name,dk);setHabitChecks(p=>({...p,[k]:!p[k]}));};
      const toggleTopic=key=>setCompletedTopics(p=>({...p,[key]:!p[key]}));

      useEffect(()=>{
        if(timerActive&&!timerPaused){timerStartRef.current=Date.now();timerRef.current=setInterval(()=>{const el=Math.floor((Date.now()-timerStartRef.current)/1000);setTimerSecs(timerAccRef.current+el);},500);}
        else{clearInterval(timerRef.current);if(timerPaused)timerAccRef.current=timerSecs;}
        return()=>clearInterval(timerRef.current);
      },[timerActive,timerPaused]);

      function startTimer(){timerAccRef.current=0;setTimerSecs(0);setTimerActive(true);setTimerPaused(false);}
      function pauseTimer(){setTimerPaused(p=>!p);}
      function stopTimer(){
        if(timerSecs>0){
          const mins=Math.round(timerSecs/60);
          setStudySessions(prev=>{const ns={...prev};if(!ns[TODAY])ns[TODAY]={};ns[TODAY][timerSubject]=(ns[TODAY][timerSubject]||0)+mins;saveSafe("sf_sessions",ns);return ns;});
          if(lastActive!==TODAY){const s=streak+1;setStreak(s);saveSafe("sf_streak",s);setLastActive(TODAY);saveSafe("sf_lastactive",TODAY);}
        }
        setTimerActive(false);setTimerPaused(false);setTimerSecs(0);timerAccRef.current=0;
      }

      useEffect(()=>{
        if(pomActive&&!pomPaused){
          pomStartRef.current=Date.now();
          pomRef.current=setInterval(()=>{
            const el=Math.floor((Date.now()-pomStartRef.current)/1000);
            const remaining=POM[pomMode].dur-(pomAccRef.current+el);
            if(remaining<=0){
              clearInterval(pomRef.current);pomAccRef.current=0;
              if(pomMode==="FOCUS"){const nr=pomRounds+1;setPomRounds(nr);const next=nr%4===0?"LONG_BREAK":"SHORT_BREAK";setPomMode(next);setPomSecs(POM[next].dur);setPomActive(false);setPomPaused(false);}
              else{setPomMode("FOCUS");setPomSecs(FOCUS_DURATION);setPomActive(false);setPomPaused(false);}
            }else{setPomSecs(remaining);}
          },500);
        }else{clearInterval(pomRef.current);if(pomPaused){const el=Math.floor((Date.now()-pomStartRef.current)/1000);pomAccRef.current+=el;}}
        return()=>clearInterval(pomRef.current);
      },[pomActive,pomPaused,pomMode]);

      function switchPom(m){clearInterval(pomRef.current);setPomActive(false);setPomPaused(false);setPomMode(m);setPomSecs(POM[m].dur);pomAccRef.current=0;}
      function startPom(){pomAccRef.current=0;setPomActive(true);setPomPaused(false);}
      function pausePom(){if(!pomPaused){pomAccRef.current+=Math.floor((Date.now()-pomStartRef.current)/1000);}else{pomStartRef.current=Date.now();}setPomPaused(p=>!p);}
      function stopPom(){clearInterval(pomRef.current);setPomActive(false);setPomPaused(false);setPomSecs(POM[pomMode].dur);pomAccRef.current=0;}

      function addTask(){if(!newTask.trim())return;setTasks(p=>[...p,{id:Date.now(),text:newTask.trim(),done:false,priority:newPri,isEditing:false}]);setNewTask("");setShowAdd(false);}
      function toggleTask(id){setTasks(p=>p.map(t=>{if(t.id===id){if(!t.done){setCelebrate(true);setTimeout(()=>setCelebrate(false),800);}return{...t,done:!t.done};}return t;}));}
      function deleteTask(id){setTasks(p=>p.filter(t=>t.id!==id));}
      function startEditTask(id){setTasks(p=>p.map(t=>t.id===id?{...t,isEditing:true}:t));}
      function saveEditTask(id,text){setTasks(p=>p.map(t=>t.id===id?{...t,text,isEditing:false}:t));}

      const todayMins=Object.values(studySessions[TODAY]||{}).reduce((a,b)=>a+b,0);
      const doneTasks=tasks.filter(t=>t.done).length;
      const taskPct=tasks.length?Math.round((doneTasks/tasks.length)*100):0;
      let totalTopics=0,doneTopicCount=0;
      Object.values(CA_PAPERS).forEach(paper=>{Object.values(paper.modules).forEach(mod=>{Object.entries(mod).forEach(([ch,units])=>{if(units.length===0){totalTopics++;if(completedTopics[ch])doneTopicCount++;}else{units.forEach(u=>{totalTopics++;if(completedTopics[`${ch}::${u}`])doneTopicCount++;});}});});});
      const syllabusPct=Math.round((doneTopicCount/Math.max(totalTopics,1))*100);
      const dailyDone=dailyHabits.filter(h=>isDone("daily",h,TODAY)).length;
      const dailyPct=Math.round((dailyDone/Math.max(dailyHabits.length,1))*100);
      const weeklyDone=weeklyHabits.filter(h=>isDone("weekly",h,TW)).length;
      const monthlyDone=monthlyHabits.filter(h=>isDone("monthly",h,TM)).length;
      const pomPct=Math.min(((POM[pomMode].dur-pomSecs)/POM[pomMode].dur)*100,100);
      const weekDays=Array.from({length:7},(_,i)=>{const d=new Date();d.setDate(d.getDate()-(6-i));const k=d.toISOString().split("T")[0];return{label:["Su","Mo","Tu","We","Th","Fr","Sa"][d.getDay()],mins:Object.values(studySessions[k]||{}).reduce((a,b)=>a+b,0),key:k};});
      const maxMins=Math.max(...weekDays.map(d=>d.mins),60);
      const PCOL={high:"#EF4444",medium:"#F59E0B",low:"#10B981"};

      const NAV=[{id:"home",icon:"home",label:"Home"},{id:"tasks",icon:"check",label:"Tasks"},{id:"habits",icon:"habit",label:"Habits"},{id:"study",icon:"timer",label:"Study"},{id:"syllabus",icon:"book",label:"Syllabus"}];

      return(
        <div style={{background:"#0d1117",minHeight:"100vh",fontFamily:"'DM Sans','Segoe UI',sans-serif",color:"#f9fafb",maxWidth:430,margin:"0 auto",position:"relative"}}>
          {/* Header */}
          <div style={{padding:"16px 16px 10px",display:"flex",justifyContent:"space-between",alignItems:"center",position:"sticky",top:0,background:"#0d1117",zIndex:10,borderBottom:"1px solid #111827"}}>
            <div>
              <div style={{fontSize:20,fontWeight:800,background:"linear-gradient(135deg,#c4b5fd,#7C3AED)",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}}>StudyFlow</div>
              <div style={{fontSize:9,color:"#4b5563"}}>by CommerceTaabar · {new Date().toLocaleDateString("en-IN",{weekday:"short",day:"numeric",month:"short"})}</div>
            </div>
            <div style={{display:"flex",gap:7,alignItems:"center"}}>
              {pomActive&&<div style={{background:pomMode==="FOCUS"?"#1a0a2e":"#0a2010",border:`1px solid ${POM[pomMode].color}`,borderRadius:20,padding:"3px 10px",display:"flex",alignItems:"center",gap:4}}><span style={{fontSize:11}}>🍅</span><span style={{fontSize:12,fontWeight:700,color:POM[pomMode].color}}>{fmt(pomSecs)}</span></div>}
              {streak>0&&<div style={{background:"#1c1408",border:"1px solid #3b2810",borderRadius:20,padding:"3px 9px",display:"flex",alignItems:"center",gap:4}}><span style={{fontSize:13}}>🔥</span><span style={{fontSize:12,fontWeight:700,color:"#F59E0B"}}>{streak}</span></div>}
            </div>
          </div>

          {/* Screens */}
          <div style={{paddingTop:14,paddingBottom:80,animation:"slideUp 0.25s ease"}}>
            {tab==="home"&&(
              <div style={{padding:"0 16px"}}>
                {/* Pomodoro */}
                <div style={{background:pomActive?(pomMode==="FOCUS"?"linear-gradient(135deg,#1a0a2e,#0d1117)":"linear-gradient(135deg,#0a2010,#0d1117)"):"#111827",border:`1px solid ${pomActive?POM[pomMode].color:"#1f2937"}`,borderRadius:16,padding:"14px 16px",marginBottom:14}}>
                  <div style={{display:"flex",alignItems:"center",gap:12}}>
                    <div style={{flex:1}}>
                      <div style={{fontSize:9,color:pomActive?POM[pomMode].color:"#6b7280",letterSpacing:2,textTransform:"uppercase",marginBottom:4}}>🍅 Pomodoro {pomActive?`· ${POM[pomMode].label}`:""}{pomRounds>0?` · Round ${pomRounds}`:""}</div>
                      <div style={{fontSize:36,fontWeight:800,color:pomActive?POM[pomMode].color:"#374151",fontVariantNumeric:"tabular-nums",letterSpacing:-2}}>{fmt(pomSecs)}</div>
                      <div style={{fontSize:10,color:"#6b7280",marginTop:2}}>{pomActive?(pomMode==="FOCUS"?"🔥 Stay locked in! Switch tabs freely":"☕ Rest — timer running in background"):"25 min focus · 5 min break"}</div>
                    </div>
                    <div style={{display:"flex",flexDirection:"column",gap:6}}>
                      {!pomActive?<button onClick={startPom} style={{background:"#7C3AED",border:"none",borderRadius:12,padding:"11px 16px",color:"white",fontWeight:700,cursor:"pointer",fontSize:13}}>Start 🍅</button>:(
                        <><button onClick={pausePom} style={{background:"#1f2937",border:"none",borderRadius:10,padding:"8px 12px",color:"white",fontWeight:600,cursor:"pointer",fontSize:12,whiteSpace:"nowrap"}}>{pomPaused?"▶ Resume":"⏸ Pause"}</button>
                        <button onClick={stopPom} style={{background:"#EF4444",border:"none",borderRadius:10,padding:"8px 12px",color:"white",fontWeight:600,cursor:"pointer",fontSize:12}}>✕ Stop</button></>
                      )}
                    </div>
                  </div>
                  <div style={{display:"flex",gap:5,marginTop:12}}>
                    {Object.keys(POM).map(m=><button key={m} onClick={()=>switchPom(m)} style={{flex:1,padding:"6px 4px",borderRadius:8,border:`1px solid ${pomMode===m?POM[m].color:"#1f2937"}`,background:pomMode===m?POM[m].color+"22":"transparent",color:pomMode===m?POM[m].color:"#4b5563",cursor:"pointer",fontSize:9,fontWeight:600}}>{m==="FOCUS"?"Focus":m==="SHORT_BREAK"?"Short":"Long"}</button>)}
                  </div>
                  {pomActive&&<div style={{marginTop:10,background:"#1f2937",borderRadius:6,height:5,overflow:"hidden"}}><div style={{height:"100%",borderRadius:6,background:POM[pomMode].color,width:`${pomPct}%`,transition:"width 0.5s linear"}}/></div>}
                </div>
                {/* Quote */}
                <div style={{background:"linear-gradient(135deg,#1a0a2e,#0d1117)",border:"1px solid #2a1a4a",borderRadius:16,padding:"14px 18px",marginBottom:14}}>
                  <div style={{fontSize:9,color:"#7C3AED",letterSpacing:2,textTransform:"uppercase",marginBottom:4}}>Today's Mantra</div>
                  <div style={{fontSize:12,color:"#c4b5fd",fontStyle:"italic",lineHeight:1.5}}>"{quote}"</div>
                </div>
                {/* Stats */}
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:14}}>
                  {[{l:"Study hrs",v:(todayMins/60).toFixed(1),e:"⏱",c:"#7C3AED"},{l:"Tasks",v:`${doneTasks}/${tasks.length}`,e:"✅",c:"#10B981"},{l:"Streak",v:streak,e:"🔥",c:"#F59E0B"}].map(s=>(
                    <div key={s.l} style={{background:"#111827",borderRadius:14,padding:"12px 8px",textAlign:"center",border:"1px solid #1f2937"}}><div style={{fontSize:18,marginBottom:3}}>{s.e}</div><div style={{fontSize:18,fontWeight:700,color:s.c}}>{s.v}</div><div style={{fontSize:9,color:"#6b7280",marginTop:2}}>{s.l}</div></div>
                  ))}
                </div>
                {/* Rings */}
                <div style={{background:"#111827",borderRadius:16,padding:18,marginBottom:14,border:"1px solid #1f2937"}}>
                  <div style={{fontWeight:600,color:"#f9fafb",fontSize:13,marginBottom:14}}>Daily Progress</div>
                  <div style={{display:"flex",gap:12,alignItems:"center",flexWrap:"wrap"}}>
                    <Ring pct={taskPct} color="#7C3AED" size={72}><span style={{fontSize:14,fontWeight:700,color:"#7C3AED"}}>{taskPct}%</span><span style={{fontSize:8,color:"#6b7280"}}>tasks</span></Ring>
                    <Ring pct={dailyPct} color="#10B981" size={72}><span style={{fontSize:14,fontWeight:700,color:"#10B981"}}>{dailyPct}%</span><span style={{fontSize:8,color:"#6b7280"}}>habits</span></Ring>
                    <Ring pct={syllabusPct} color="#F59E0B" size={72}><span style={{fontSize:14,fontWeight:700,color:"#F59E0B"}}>{syllabusPct}%</span><span style={{fontSize:8,color:"#6b7280"}}>syllabus</span></Ring>
                  </div>
                  <div style={{marginTop:14}}>
                    <div style={{fontSize:11,color:"#9ca3af",marginBottom:6}}>Study Goal — 6h/day</div>
                    <div style={{background:"#1f2937",borderRadius:6,height:7,overflow:"hidden"}}><div style={{height:"100%",width:`${Math.min((todayMins/360)*100,100)}%`,background:"linear-gradient(90deg,#7C3AED,#06B6D4)",borderRadius:6,transition:"width 0.6s ease"}}/></div>
                    <div style={{fontSize:10,color:"#6b7280",marginTop:4}}>{(todayMins/60).toFixed(1)}h / 6h</div>
                  </div>
                </div>
                {/* Mood */}
                <div style={{background:"#111827",borderRadius:16,padding:18,marginBottom:14,border:"1px solid #1f2937"}}>
                  <div style={{fontWeight:600,color:"#f9fafb",fontSize:13,marginBottom:12}}>How are you feeling? ✨</div>
                  <div style={{display:"flex",gap:6}}>
                    {MOODS.map(m=><button key={m.v} onClick={()=>setMood(m.v)} style={{flex:1,padding:"9px 3px",borderRadius:12,border:`2px solid ${mood===m.v?"#7C3AED":"#1f2937"}`,background:mood===m.v?"#1a0a2e":"#0d1117",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:3,transform:mood===m.v?"scale(1.08)":"scale(1)",transition:"all 0.2s"}}><span style={{fontSize:20}}>{m.e}</span><span style={{fontSize:8,color:mood===m.v?"#c4b5fd":"#4b5563"}}>{m.l}</span></button>)}
                  </div>
                </div>
                {/* Week bars */}
                <div style={{background:"#111827",borderRadius:16,padding:18,border:"1px solid #1f2937"}}>
                  <div style={{fontWeight:600,color:"#f9fafb",fontSize:13,marginBottom:14}}>This Week 📅</div>
                  <div style={{display:"flex",gap:5,alignItems:"flex-end",height:72}}>
                    {weekDays.map(d=><div key={d.key} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:3}}><div style={{width:"100%",borderRadius:"4px 4px 2px 2px",height:`${Math.max((d.mins/maxMins)*60,d.mins>0?6:2)}px`,background:d.key===TODAY?"linear-gradient(180deg,#7C3AED,#4f46e5)":d.mins>0?"#2d1f5e":"#1f2937",transition:"height 0.4s ease"}}/><span style={{fontSize:8,color:d.key===TODAY?"#c4b5fd":"#4b5563"}}>{d.label}</span></div>)}
                  </div>
                </div>
              </div>
            )}

            {tab==="tasks"&&(
              <div style={{padding:"0 16px"}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
                  <div><div style={{fontSize:18,fontWeight:700,color:"#f9fafb"}}>Today's Tasks</div><div style={{fontSize:11,color:"#6b7280"}}>{doneTasks}/{tasks.length} completed</div></div>
                  <button onClick={()=>setShowAdd(true)} style={{background:"#7C3AED",border:"none",borderRadius:12,width:38,height:38,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",color:"white"}}><Icon name="plus"/></button>
                </div>
                {tasks.length>0&&<div style={{marginBottom:14}}><div style={{background:"#1f2937",borderRadius:8,height:5,overflow:"hidden"}}><div style={{height:"100%",width:`${taskPct}%`,background:"linear-gradient(90deg,#7C3AED,#10B981)",transition:"width 0.5s",borderRadius:8}}/></div></div>}
                {showAdd&&(
                  <div style={{background:"#111827",borderRadius:16,padding:18,marginBottom:14,border:"1px solid #7C3AED"}}>
                    <input value={newTask} onChange={e=>setNewTask(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addTask()} placeholder="Add a task..." autoFocus style={{width:"100%",background:"#0d1117",border:"1px solid #1f2937",borderRadius:10,padding:"11px 13px",color:"#f9fafb",fontSize:14,outline:"none",boxSizing:"border-box",marginBottom:10}}/>
                    <div style={{display:"flex",gap:7,marginBottom:10}}>{["high","medium","low"].map(p=><button key={p} onClick={()=>setNewPri(p)} style={{flex:1,padding:"7px 0",borderRadius:8,border:`2px solid ${newPri===p?PCOL[p]:"#1f2937"}`,background:newPri===p?PCOL[p]+"22":"#0d1117",color:newPri===p?PCOL[p]:"#6b7280",cursor:"pointer",fontSize:11,fontWeight:600,textTransform:"capitalize"}}>{p}</button>)}</div>
                    <div style={{display:"flex",gap:8}}>
                      <button onClick={addTask} style={{flex:1,padding:"11px 0",borderRadius:10,background:"#7C3AED",border:"none",color:"white",fontWeight:600,cursor:"pointer",fontSize:13}}>Add Task</button>
                      <button onClick={()=>setShowAdd(false)} style={{width:42,borderRadius:10,background:"#1f2937",border:"none",color:"#9ca3af",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}><Icon name="x" size={15}/></button>
                    </div>
                  </div>
                )}
                {tasks.length===0?<div style={{textAlign:"center",padding:"40px 0",color:"#4b5563"}}><div style={{fontSize:36,marginBottom:10}}>📋</div><div style={{fontSize:13}}>No tasks yet!</div></div>:(
                  <div style={{display:"flex",flexDirection:"column",gap:7}}>
                    {tasks.map(task=>(
                      <div key={task.id} style={{background:"#111827",borderRadius:14,padding:"12px 14px",border:`1px solid ${task.done?"#10B98133":"#1f2937"}`,display:"flex",alignItems:"center",gap:10,opacity:task.done?0.6:1,transition:"all 0.3s"}}>
                        <button onClick={()=>toggleTask(task.id)} style={{width:22,height:22,borderRadius:7,flexShrink:0,cursor:"pointer",border:`2px solid ${task.done?"#10B981":"#374151"}`,background:task.done?"#10B981":"transparent",display:"flex",alignItems:"center",justifyContent:"center",color:"white"}}>{task.done&&<Icon name="check" size={12}/>}</button>
                        {task.isEditing?<input defaultValue={task.text} autoFocus onBlur={e=>saveEditTask(task.id,e.target.value)} onKeyDown={e=>e.key==="Enter"&&saveEditTask(task.id,e.target.value)} style={{flex:1,background:"#0d1117",border:"1px solid #7C3AED",borderRadius:8,padding:"4px 8px",color:"#f9fafb",fontSize:13,outline:"none"}}/>:
                        <span onDoubleClick={()=>startEditTask(task.id)} style={{flex:1,fontSize:13,color:task.done?"#6b7280":"#f9fafb",textDecoration:task.done?"line-through":"none",cursor:"text"}}>{task.text}</span>}
                        <span style={{fontSize:9,padding:"3px 7px",borderRadius:6,background:PCOL[task.priority]+"22",color:PCOL[task.priority],fontWeight:700,textTransform:"uppercase",flexShrink:0}}>{task.priority}</span>
                        <button onClick={()=>startEditTask(task.id)} style={{background:"none",border:"none",color:"#4b5563",cursor:"pointer",padding:2,flexShrink:0}}><Icon name="edit" size={13}/></button>
                        <button onClick={()=>deleteTask(task.id)} style={{background:"none",border:"none",color:"#374151",cursor:"pointer",padding:2,flexShrink:0}}><Icon name="trash" size={13}/></button>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {tab==="habits"&&(
              <div style={{padding:"0 16px"}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
                  <div><div style={{fontSize:18,fontWeight:700,color:"#f9fafb"}}>Habit Tracker</div></div>
                  <button onClick={()=>setShowEdit(true)} style={{background:"#1f2937",border:"1px solid #374151",borderRadius:10,padding:"8px 13px",color:"#c4b5fd",cursor:"pointer",fontSize:11,fontWeight:600,display:"flex",alignItems:"center",gap:5}}><Icon name="edit" size={13}/>Edit</button>
                </div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:16}}>
                  {[{l:"Today",v:`${dailyDone}/${dailyHabits.length}`,c:"#10B981"},{l:"This Week",v:`${weeklyDone}/${weeklyHabits.length}`,c:"#F59E0B"},{l:"This Month",v:`${monthlyDone}/${monthlyHabits.length}`,c:"#7C3AED"}].map(s=>(
                    <div key={s.l} style={{background:"#111827",borderRadius:14,padding:"12px 8px",textAlign:"center",border:"1px solid #1f2937"}}><div style={{fontSize:16,fontWeight:700,color:s.c}}>{s.v}</div><div style={{fontSize:9,color:"#6b7280",marginTop:2}}>{s.l}</div></div>
                  ))}
                </div>
                <div style={{display:"flex",background:"#111827",borderRadius:12,padding:4,marginBottom:16,border:"1px solid #1f2937"}}>
                  {[["daily","Daily"],["weekly","Weekly"],["monthly","Monthly"]].map(([id,lb])=>(
                    <button key={id} onClick={()=>setHabitTab(id)} style={{flex:1,padding:"8px 4px",borderRadius:8,border:"none",cursor:"pointer",fontSize:11,fontWeight:600,background:habitTab===id?"#7C3AED":"transparent",color:habitTab===id?"white":"#6b7280",transition:"all 0.2s"}}>{lb}</button>
                  ))}
                </div>
                {habitTab==="daily"&&(
                  <div>
                    <div style={{background:"#1f2937",borderRadius:6,height:5,marginBottom:14,overflow:"hidden"}}><div style={{height:"100%",width:`${dailyPct}%`,background:"linear-gradient(90deg,#10B981,#06B6D4)",borderRadius:6,transition:"width 0.4s"}}/></div>
                    <div style={{display:"flex",flexDirection:"column",gap:7}}>
                      {dailyHabits.map((h,i)=>{const done=isDone("daily",h,TODAY);return(
                        <div key={h+i} onClick={()=>toggleHabit("daily",h,TODAY)} style={{background:"#111827",borderRadius:14,padding:"13px 14px",border:`1px solid ${done?"#10B98133":"#1f2937"}`,display:"flex",alignItems:"center",gap:11,cursor:"pointer",opacity:done?0.7:1,transition:"all 0.2s"}}>
                          <div style={{width:22,height:22,borderRadius:7,flexShrink:0,border:`2px solid ${done?"#10B981":"#374151"}`,background:done?"#10B981":"transparent",display:"flex",alignItems:"center",justifyContent:"center",color:"white"}}>{done&&<Icon name="check" size={12}/>}</div>
                          <span style={{flex:1,fontSize:13,color:done?"#6b7280":"#f9fafb",textDecoration:done?"line-through":"none"}}>{h}</span>
                          <span style={{fontSize:10,color:"#4b5563"}}>#{i+1}</span>
                        </div>
                      );})}
                    </div>
                  </div>
                )}
                {habitTab==="weekly"&&(
                  <div style={{display:"flex",flexDirection:"column",gap:7}}>
                    {weeklyHabits.map((h,i)=>{const done=isDone("weekly",h,TW);return(
                      <div key={h+i} onClick={()=>toggleHabit("weekly",h,TW)} style={{background:"#111827",borderRadius:14,padding:"13px 14px",border:`1px solid ${done?"#F59E0B33":"#1f2937"}`,display:"flex",alignItems:"center",gap:11,cursor:"pointer",opacity:done?0.7:1}}>
                        <div style={{width:22,height:22,borderRadius:7,flexShrink:0,border:`2px solid ${done?"#F59E0B":"#374151"}`,background:done?"#F59E0B":"transparent",display:"flex",alignItems:"center",justifyContent:"center",color:"white"}}>{done&&<Icon name="check" size={12}/>}</div>
                        <span style={{flex:1,fontSize:13,color:done?"#6b7280":"#f9fafb",textDecoration:done?"line-through":"none"}}>{h}</span>
                      </div>
                    );})}
                  </div>
                )}
                {habitTab==="monthly"&&(
                  <div>
                    <div style={{background:"#111827",borderRadius:14,padding:16,marginBottom:14,border:"1px solid #1f2937",display:"flex",alignItems:"center",gap:16}}>
                      <Ring pct={Math.round((monthlyDone/Math.max(monthlyHabits.length,1))*100)} color="#7C3AED" size={72}><span style={{fontSize:14,fontWeight:700,color:"#7C3AED"}}>{Math.round((monthlyDone/Math.max(monthlyHabits.length,1))*100)}%</span></Ring>
                      <div><div style={{fontSize:13,color:"#f9fafb",fontWeight:600}}>{monthlyDone}/{monthlyHabits.length} done</div><div style={{fontSize:11,color:"#6b7280",marginTop:3}}>This Month</div></div>
                    </div>
                    <div style={{display:"flex",flexDirection:"column",gap:7}}>
                      {monthlyHabits.map((h,i)=>{const done=isDone("monthly",h,TM);return(
                        <div key={h+i} onClick={()=>toggleHabit("monthly",h,TM)} style={{background:"#111827",borderRadius:14,padding:"13px 14px",border:`1px solid ${done?"#7C3AED33":"#1f2937"}`,display:"flex",alignItems:"center",gap:11,cursor:"pointer",opacity:done?0.7:1}}>
                          <div style={{width:22,height:22,borderRadius:7,flexShrink:0,border:`2px solid ${done?"#7C3AED":"#374151"}`,background:done?"#7C3AED":"transparent",display:"flex",alignItems:"center",justifyContent:"center",color:"white"}}>{done&&<Icon name="check" size={12}/>}</div>
                          <span style={{flex:1,fontSize:13,color:done?"#6b7280":"#f9fafb",textDecoration:done?"line-through":"none"}}>{h}</span>
                        </div>
                      );})}
                    </div>
                  </div>
                )}
              </div>
            )}

            {tab==="study"&&(
              <div style={{padding:"0 16px"}}>
                <div style={{background:"linear-gradient(135deg,#1a0a2e,#0d1117)",border:"1px solid #2a1a4a",borderRadius:20,padding:22,marginBottom:16,textAlign:"center"}}>
                  <div style={{fontSize:11,color:"#6b7280",marginBottom:8,letterSpacing:1}}>STUDY SESSION TIMER</div>
                  <div style={{fontSize:50,fontWeight:800,color:"#c4b5fd",fontVariantNumeric:"tabular-nums",letterSpacing:-2,marginBottom:8}}>{fmt(timerSecs)}</div>
                  <div style={{fontSize:11,color:"#6b7280",marginBottom:16}}>{timerActive?(timerPaused?"⏸ Paused":"▶ Running — switch tabs freely!"):"Ready to start"}</div>
                  <select value={timerSubject} onChange={e=>setTimerSubject(e.target.value)} disabled={timerActive} style={{width:"100%",background:"#111827",border:"1px solid #1f2937",borderRadius:10,padding:"10px 12px",color:"#f9fafb",fontSize:12,marginBottom:14,outline:"none"}}>
                    {Object.keys(CA_PAPERS).map(s=><option key={s} value={s}>{CA_PAPERS[s].icon} {s}</option>)}
                  </select>
                  <div style={{display:"flex",gap:8}}>
                    {!timerActive?<button onClick={startTimer} style={{flex:1,padding:"13px 0",borderRadius:12,background:"#7C3AED",border:"none",color:"white",fontWeight:700,cursor:"pointer",fontSize:14,display:"flex",alignItems:"center",justifyContent:"center",gap:7}}><Icon name="play" size={15}/>Start Session</button>:(
                      <><button onClick={pauseTimer} style={{flex:1,padding:"13px 0",borderRadius:12,background:"#1f2937",border:"none",color:"#f9fafb",fontWeight:600,cursor:"pointer",fontSize:13,display:"flex",alignItems:"center",justifyContent:"center",gap:7}}><Icon name={timerPaused?"play":"pause"} size={14}/>{timerPaused?"Resume":"Pause"}</button>
                      <button onClick={stopTimer} style={{flex:1,padding:"13px 0",borderRadius:12,background:"#EF4444",border:"none",color:"white",fontWeight:600,cursor:"pointer",fontSize:13,display:"flex",alignItems:"center",justifyContent:"center",gap:7}}><Icon name="stop" size={14}/>Save</button></>
                    )}
                  </div>
                </div>
                <div style={{background:"#111827",borderRadius:16,padding:18,marginBottom:14,border:"1px solid #1f2937"}}>
                  <div style={{fontWeight:600,color:"#f9fafb",fontSize:13,marginBottom:14}}>Today · {(todayMins/60).toFixed(1)}h</div>
                  {Object.keys(studySessions[TODAY]||{}).length===0?<div style={{textAlign:"center",padding:"16px 0",color:"#4b5563",fontSize:12}}>No sessions yet 📚</div>:(
                    Object.entries(studySessions[TODAY]||{}).map(([sub,mins])=>(
                      <div key={sub} style={{display:"flex",alignItems:"center",gap:10,marginBottom:11}}>
                        <span style={{fontSize:16,flexShrink:0}}>{CA_PAPERS[sub]?.icon||"📖"}</span>
                        <div style={{flex:1}}>
                          <div style={{fontSize:11,color:"#f9fafb",marginBottom:3}}>{sub.split(":")[0]}</div>
                          <div style={{background:"#1f2937",borderRadius:4,height:5}}><div style={{height:"100%",width:`${Math.min((mins/120)*100,100)}%`,background:CA_PAPERS[sub]?.color||"#7C3AED",borderRadius:4}}/></div>
                        </div>
                        <span style={{fontSize:12,color:"#c4b5fd",fontWeight:600}}>{mins>=60?`${(mins/60).toFixed(1)}h`:`${mins}m`}</span>
                      </div>
                    ))
                  )}
                </div>
                <div style={{background:"linear-gradient(135deg,#1c1408,#0d1117)",border:"1px solid #3b2810",borderRadius:16,padding:18,textAlign:"center"}}>
                  <div style={{fontSize:40}}>🔥</div>
                  <div style={{fontSize:32,fontWeight:800,color:"#F59E0B"}}>{streak}</div>
                  <div style={{fontSize:12,color:"#92400e"}}>Day Streak</div>
                </div>
              </div>
            )}

            {tab==="syllabus"&&(
              <div style={{padding:"0 16px"}}>
                <div style={{marginBottom:16}}>
                  <div style={{fontSize:18,fontWeight:700,color:"#f9fafb"}}>CA Foundation Syllabus</div>
                  <div style={{fontSize:11,color:"#6b7280",marginTop:2}}>{doneTopicCount}/{totalTopics} done · {syllabusPct}%</div>
                  <div style={{background:"#1f2937",borderRadius:8,height:5,marginTop:8,overflow:"hidden"}}><div style={{height:"100%",width:`${syllabusPct}%`,background:"linear-gradient(90deg,#10B981,#06B6D4)",borderRadius:8,transition:"width 0.5s"}}/></div>
                </div>
                {Object.entries(CA_PAPERS).map(([paper,data])=>{
                  const open=expandedPaper===paper;
                  return(
                    <div key={paper} style={{background:"#111827",borderRadius:16,marginBottom:10,border:`1px solid ${open?data.color+"44":"#1f2937"}`,overflow:"hidden"}}>
                      <button onClick={()=>{setExpandedPaper(open?null:paper);setExpandedChapter(null);}} style={{width:"100%",padding:"14px 16px",background:"none",border:"none",cursor:"pointer",display:"flex",alignItems:"center",gap:12,textAlign:"left"}}>
                        <span style={{fontSize:20,flexShrink:0}}>{data.icon}</span>
                        <div style={{flex:1}}><div style={{fontSize:12,fontWeight:600,color:"#f9fafb"}}>{paper}</div></div>
                        <span style={{color:"#4b5563",transform:open?"rotate(90deg)":"none",transition:"transform 0.2s"}}><Icon name="chevron" size={15}/></span>
                      </button>
                      {open&&(
                        <div style={{borderTop:"1px solid #1f2937"}}>
                          {Object.entries(data.modules).map(([modName,chapters])=>(
                            <div key={modName}>
                              {modName&&<div style={{padding:"10px 16px 6px",fontSize:10,fontWeight:700,color:data.color,textTransform:"uppercase",letterSpacing:1}}>{modName}</div>}
                              {Object.entries(chapters).map(([chName,units])=>{
                                const isChOpen=expandedChapter===`${paper}::${chName}`;
                                const chDone=units.length===0?!!completedTopics[chName]:units.every(u=>completedTopics[`${chName}::${u}`]);
                                return(
                                  <div key={chName} style={{borderTop:"1px solid #0d1117"}}>
                                    <div style={{display:"flex",alignItems:"center",gap:10,padding:"11px 16px",cursor:"pointer"}} onClick={()=>units.length>0?setExpandedChapter(isChOpen?null:`${paper}::${chName}`):toggleTopic(chName)}>
                                      <div style={{width:18,height:18,borderRadius:5,flexShrink:0,border:`2px solid ${chDone?data.color:"#374151"}`,background:chDone?data.color:"transparent",display:"flex",alignItems:"center",justifyContent:"center",color:"white"}}>{chDone&&<Icon name="check" size={10}/>}</div>
                                      <span style={{flex:1,fontSize:12,color:chDone?"#6b7280":"#d1d5db",textDecoration:chDone?"line-through":"none"}}>{chName}</span>
                                      {units.length>0&&<span style={{color:"#4b5563",transform:isChOpen?"rotate(90deg)":"none",transition:"transform 0.2s"}}><Icon name="chevron" size={13}/></span>}
                                    </div>
                                    {isChOpen&&units.length>0&&(
                                      <div style={{paddingLeft:32,paddingBottom:8}}>
                                        {units.map(u=>{const key=`${chName}::${u}`;const done=!!completedTopics[key];return(
                                          <div key={u} onClick={()=>toggleTopic(key)} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 16px 8px 0",borderTop:"1px solid #0d1117",cursor:"pointer"}}>
                                            <div style={{width:16,height:16,borderRadius:4,flexShrink:0,border:`2px solid ${done?data.color:"#374151"}`,background:done?data.color:"transparent",display:"flex",alignItems:"center",justifyContent:"center",color:"white"}}>{done&&<Icon name="check" size={9}/>}</div>
                                            <span style={{fontSize:11,color:done?"#6b7280":"#9ca3af",textDecoration:done?"line-through":"none"}}>{u}</span>
                                          </div>
                                        );})}
                                      </div>
                                    )}
                                  </div>
                                );
                              })}
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            )}
          </div>

          {/* Nav */}
          <div style={{position:"fixed",bottom:0,left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:430,background:"#0d1117",borderTop:"1px solid #111827",display:"flex",padding:"8px 6px 14px",gap:3,zIndex:20}}>
            {NAV.map(n=>(
              <button key={n.id} onClick={()=>setTab(n.id)} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:2,padding:"7px 2px",borderRadius:12,border:"none",cursor:"pointer",background:tab===n.id?"#7C3AED22":"transparent",color:tab===n.id?"#7C3AED":"#4b5563",transition:"all 0.2s"}}>
                <Icon name={n.icon} size={19}/><span style={{fontSize:7,fontWeight:tab===n.id?700:400,letterSpacing:0.3}}>{n.label}</span>
              </button>
            ))}
          </div>

          {showEdit&&<EditPanel daily={dailyHabits} weekly={weeklyHabits} monthly={monthlyHabits} onSave={handleSaveHabits} onClose={()=>setShowEdit(false)}/>}
          {celebrate&&<div style={{position:"fixed",top:"50%",left:"50%",transform:"translate(-50%,-50%)",fontSize:56,pointerEvents:"none",zIndex:999,animation:"pop 0.8s ease forwards"}}>✅</div>}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App/>);
  </script>
</body>
</html>
